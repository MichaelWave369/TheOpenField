name: Deploy The Open Field to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify content
        run: npm test
      - name: Build site
        run: npm run build
      - name: Install Chromium for real-browser checks
        run: npx playwright install --with-deps chromium
      - name: Verify site renders in Chromium before deployment
        run: npm run test:browser
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Allow GitHub artifact listing to settle
        run: sleep 15
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
